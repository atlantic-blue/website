name: Web

on:
  pull_request:
    paths:
      - "packages/web/**"
      - ".github/workflows/web.yml"
  push:
    branches:
      - main
    paths:
      - "packages/web/**"
      - ".github/workflows/web.yml"

jobs:
  gates:
    name: Format, lint, types and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version-file: packages/web/.nvmrc
          cache: npm
          cache-dependency-path: packages/web/package-lock.json

      - run: npm ci

      # Each gate is its own step so a failure names itself in the log. Never
      # pipe a gate anywhere: a pipeline reports the status of its last command.
      - run: npm run format
      - run: npm run lint
      - run: npm run check
      - run: npm run test
